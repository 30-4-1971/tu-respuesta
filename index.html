<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tarot Nazaret LIVE</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090313}body{display:flex;justify-content:center}#app{position:relative;width:min(100vw,56.25vh);height:100vh;overflow:hidden;background:#090313 url("fondo.png") center/100% 100% no-repeat}.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.05),transparent 55%,rgba(5,0,15,.25));pointer-events:none}.cards{position:absolute;left:5%;right:5%;top:62%;height:17%;display:flex;gap:4%;justify-content:center;align-items:center}.card{flex:1;max-width:29%;height:100%;border:2px solid #e7bb50;border-radius:9px;background:rgba(7,16,45,.08);box-shadow:0 0 10px rgba(255,210,90,.35);cursor:pointer;transition:.2s}.card.selected{transform:translateY(-10px);box-shadow:0 0 25px #ffd86b;background:rgba(255,215,100,.14)}#reading{position:absolute;left:7%;right:7%;bottom:3.2%;min-height:7%;padding:7px 10px;border:1px solid #d7a83d;border-radius:12px;background:rgba(12,2,26,.88);color:#fff;text-align:center;font:clamp(10px,2.8vw,15px)/1.2 Georgia,serif}#reading strong{color:#ffd86b}.hint{position:absolute;left:8%;right:8%;top:54.5%;text-align:center;color:#ffe08a;font:bold clamp(11px,3vw,16px) Georgia,serif;text-shadow:0 0 8px #000;pointer-events:none}.tag{position:absolute;top:2%;left:4%;padding:5px 8px;border:1px solid #d9a83d;border-radius:8px;background:rgba(10,2,22,.65);color:#ffd86b;font:10px Georgia,serif}</style></head><body><div id="app"><div class="shade"></div><div class="tag">✦ TAROT NAZARET • LIVE ✦</div><div class="hint">LEE LA PREGUNTA DEL CHAT Y ELIGE UNA CARTA</div><div class="cards"><div class="card"></div><div class="card"></div><div class="card"></div></div><div id="reading"><strong>Esperando tu pregunta...</strong><br>Elige una de las tres cartas.</div></div><script>
const rs=[['La Estrella','Hay una etapa que empieza a aclararse. Algo que parecía detenido puede recuperar movimiento.'],['El Sol','Llega claridad y una conversación puede ayudarte a ver la situación de otra manera.'],['La Luna','Todavía falta información. Confía en tu intuición, pero evita precipitar conclusiones.'],['La Emperatriz','Algo que estás cuidando puede crecer si mantienes la paciencia y la confianza.'],['El Mago','Una iniciativa tuya puede cambiar el rumbo de una situación que parecía estancada.'],['La Fuerza','La calma y la constancia serán más útiles que intentar forzar las cosas.'],['El Mundo','Se acerca un cierre que puede dejar espacio para una etapa nueva.'],['Los Enamorados','Hay una decisión que pide sinceridad contigo misma y con los demás.'],['La Rueda','Las circunstancias pueden cambiar pronto y mover varias piezas a la vez.']];let n=0;document.querySelectorAll('.card').forEach((c,i)=>c.onclick=()=>{document.querySelectorAll('.card').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');let r=rs[(n*3+i)%rs.length];n++;document.querySelector('#reading').innerHTML='<strong>'+r[0]+'</strong><br>'+r[1];if(window.speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(r[0]+'. '+r[1]);u.lang='es-ES';u.rate=.9;speechSynthesis.speak(u)}});</script></body></html>
